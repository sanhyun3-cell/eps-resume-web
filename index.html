<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGK(Let's Go Korea)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --eps-blue: #0b3d91; --eps-light-blue: #1e40af; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-eps { background-color: var(--eps-blue); }
        .text-eps { color: var(--eps-blue); }
        .btn-eps { background-color: var(--eps-blue); color: white; transition: background-color 0.3s; }
        .btn-eps:hover { background-color: var(--eps-light-blue); }
    </style>
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <nav class="bg-eps text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 sm:gap-3">
                    <span class="font-bold text-lg sm:text-xl tracking-wide" id="nav-title">LGK(Let's Go Korea) 🇰🇷 🇮🇩 🇲🇲 🇻🇳</span>
                </div>
                <div>
                    <select id="lang-select" class="bg-white text-gray-900 text-xs sm:text-sm rounded-md block p-1 sm:p-2" onchange="changeLanguage()">
                        <option value="en">English</option>
                        <option value="my">မြန်မာ</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="id">Indonesia</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-8 px-4 sm:px-6 pb-12">
        <!-- 상단 환호하는 이미지 (고화질 플레이스홀더 적용) -->
        <div class="mb-8 rounded-xl overflow-hidden shadow-lg h-56 sm:h-72 bg-gray-200">
            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Cheering People" class="w-full h-full object-cover">
        </div>

        <!-- 1. 초기 선택 화면 (다운로드 / 업로드 버튼) -->
        <div id="selection-screen" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-10">
            <!-- 다운로드 버튼 (누르면 파일 다운로드 실행) -->
            <a href="eps_resume_template.pdf" download class="flex flex-col items-center justify-center p-8 bg-white border-2 border-blue-800 rounded-xl shadow-md hover:bg-blue-50 transition cursor-pointer text-center group">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📥</div>
                <h3 class="text-xl font-bold text-gray-900" id="btn-download-main">Download Resume</h3>
                <p class="text-sm text-gray-500 mt-2" id="desc-download">Get the standard form</p>
            </a>

            <!-- 업로드 버튼 (누르면 화면 전환) -->
            <div onclick="showUploadForm()" class="flex flex-col items-center justify-center p-8 bg-white border-2 border-blue-800 rounded-xl shadow-md hover:bg-blue-50 transition cursor-pointer text-center group">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📤</div>
                <h3 class="text-xl font-bold text-gray-900" id="btn-upload-main">Upload Resume</h3>
                <p class="text-sm text-gray-500 mt-2" id="desc-upload">Submit your filled form</p>
            </div>
        </div>

        <!-- 2. 이력서 업로드 폼 화면 (초기엔 숨겨져 있음) -->
        <div id="upload-screen" class="hidden bg-white shadow-lg rounded-lg p-6 sm:p-10 border-t-4 border-blue-800">
            <button onclick="showSelectionScreen()" class="mb-6 text-sm font-semibold text-blue-800 hover:text-blue-600 flex items-center gap-1" id="btn-back">
                ← Back to Selection
            </button>
            
            <h2 class="text-2xl font-bold text-gray-900 mb-6" id="form-title">Submit Your Resume</h2>
            
            <form id="resume-form" class="space-y-6">
                <div>
                    <label for="eps-id" class="block text-sm font-medium text-gray-700" id="label-eps">EPS-TOPIK ID</label>
                    <input type="text" id="eps-id" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700" id="label-name">Full Name</label>
                    <input type="text" id="full-name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700" id="label-phone">Phone Number</label>
                    <input type="tel" id="phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="010-XXXX-XXXX" required>
                </div>

                <div>
                    <label for="file-upload" class="block text-sm font-medium text-gray-700" id="label-file">Upload Completed Resume</label>
                    <input type="file" id="file-upload" accept=".pdf,.jpg,.jpeg,.png" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
                </div>

                <button type="button" class="w-full btn-eps flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium" id="btn-submit" onclick="alert('Submission system will be connected soon!')">
                    Submit Application
                </button>
            </form>
        </div>
    </main>

    <!-- 스크립트: 다국어 번역 및 화면 전환 로직 -->
    <script>
        // 화면 전환 함수
        function showUploadForm() {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('upload-screen').classList.remove('hidden');
        }

        function showSelectionScreen() {
            document.getElementById('upload-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }

        // 다국어 데이터
        const translations = {
            en: {
                btnDownloadMain: "Download Resume", descDownload: "Get the standard form",
                btnUploadMain: "Upload Resume", descUpload: "Submit your filled form",
                btnBack: "← Back to Selection", formTitle: "Submit Your Resume",
                labelEps: "EPS-TOPIK ID", labelName: "Full Name", labelPhone: "Phone Number", 
                labelFile: "Upload Completed Resume", btnSubmit: "Submit Application"
            },
            my: {
                btnDownloadMain: "ကိုယ်ရေးရာဇဝင် ဒေါင်းလုဒ်လုပ်ပါ", descDownload: "ပုံမှန်ဖောင်ကို ရယူပါ",
                btnUploadMain: "ကိုယ်ရေးရာဇဝင် အပ်လုဒ်လုပ်ပါ", descUpload: "ဖြည့်စွက်ထားသော ဖောင်ကို တင်ပါ",
                btnBack: "← နောက်သို့", formTitle: "သင့်ကိုယ်ရေးရာဇဝင်ကို တင်သွင်းပါ",
                labelEps: "EPS-TOPIK ID", labelName: "အမည်အပြည့်အစုံ", labelPhone: "ဖုန်းနံပါတ်", 
                labelFile: "ပြီးပြည့်စုံသော ကိုယ်ရေးရာဇဝင်ကို အပ်လုဒ်လုပ်ပါ", btnSubmit: "လျှောက်လွှာတင်သွင်းပါ"
            },
            vi: {
                btnDownloadMain: "Tải xuống Sơ yếu lý lịch", descDownload: "Nhận biểu mẫu chuẩn",
                btnUploadMain: "Tải lên Sơ yếu lý lịch", descUpload: "Gửi biểu mẫu đã điền của bạn",
                btnBack: "← Quay lại lựa chọn", formTitle: "Nộp sơ yếu lý lịch của bạn",
                labelEps: "ID EPS-TOPIK", labelName: "Họ và tên", labelPhone: "Số điện thoại", 
                labelFile: "Tải lên Sơ yếu lý lịch đã hoàn thành", btnSubmit: "Nộp đơn"
            },
            id: {
                btnDownloadMain: "Unduh Resume", descDownload: "Dapatkan formulir standar",
                btnUploadMain: "Unggah Resume", descUpload: "Kirim formulir yang telah diisi",
                btnBack: "← Kembali ke Pilihan", formTitle: "Kirimkan Resume Anda",
                labelEps: "ID EPS-TOPIK", labelName: "Nama Lengkap", labelPhone: "Nomor Telepon", 
                labelFile: "Unggah Resume yang Telah Diisi", btnSubmit: "Kirim Aplikasi"
            }
        };

        // 언어 변경 함수
        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang];
            
            document.getElementById('btn-download-main').innerText = t.btnDownloadMain;
            document.getElementById('desc-download').innerText = t.descDownload;
            document.getElementById('btn-upload-main').innerText = t.btnUploadMain;
            document.getElementById('desc-upload').innerText = t.descUpload;
            document.getElementById('btn-back').innerText = t.btnBack;
            document.getElementById('form-title').innerText = t.formTitle;
            document.getElementById('label-eps').innerText = t.labelEps;
            document.getElementById('label-name').innerText = t.labelName;
            document.getElementById('label-phone').innerText = t.labelPhone;
            document.getElementById('label-file').innerText = t.labelFile;
            document.getElementById('btn-submit').innerText = t.btnSubmit;
        }
    </script>
</body>
</html>
