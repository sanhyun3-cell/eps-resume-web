<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS Worker Resume Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* EPS 공식 홈페이지 느낌의 파란색 계열 설정 */
        :root { --eps-blue: #0b3d91; --eps-light-blue: #1e40af; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-eps { background-color: var(--eps-blue); }
        .text-eps { color: var(--eps-blue); }
        .btn-eps { background-color: var(--eps-blue); color: white; transition: background-color 0.3s; }
        .btn-eps:hover { background-color: var(--eps-light-blue); }
    </style>
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <nav class="bg-eps text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-xl tracking-wide" id="nav-title">EPS Global Portal</span>
                </div>
                <!-- 언어 선택 셀렉트 박스 -->
                <div>
                    <select id="lang-select" class="bg-white text-gray-900 text-sm rounded-md block w-full p-2" onchange="changeLanguage()">
                        <option value="en">English</option>
                        <option value="my">မြန်မာ (Myanmar)</option>
                        <option value="vi">Tiếng Việt (Vietnamese)</option>
                        <option value="id">Bahasa Indonesia</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 폼 영역 -->
    <main class="max-w-3xl mx-auto mt-10 px-4 sm:px-6">
        <div class="bg-white shadow-lg rounded-lg p-6 sm:p-10 border-t-4 border-blue-800">
            <h2 class="text-2xl font-bold text-gray-900 mb-6" id="form-title">Submit Your Resume</h2>
            
            <!-- 양식 다운로드 영역 -->
            <div class="mb-8 p-4 bg-blue-50 rounded-md border border-blue-100">
                <p class="text-sm text-gray-700" id="download-desc">Please download the standard resume form, fill it out, and upload it below.</p>
                <a href="eps_resume_template.pdf" download class="mt-3 inline-block btn-eps px-4 py-2 rounded shadow-sm text-sm font-medium" id="btn-download">
                    📥 Download Resume Form
                </a>
            </div>

            <!-- 정보 입력 및 업로드 폼 -->
            <form id="resume-form" class="space-y-6">
                <div>
                    <label for="eps-id" class="block text-sm font-medium text-gray-700" id="label-eps">EPS-TOPIK ID</label>
                    <input type="text" id="eps-id" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700" id="label-name">Full Name</label>
                    <input type="text" id="full-name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- 추가된 전화번호 입력 칸 -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700" id="label-phone">Phone Number</label>
                    <input type="tel" id="phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="010-XXXX-XXXX" required>
                </div>

                <div>
                    <label for="file-upload" class="block text-sm font-medium text-gray-700" id="label-file">Upload Completed Resume</label>
                    <input type="file" id="file-upload" accept=".pdf,.jpg,.jpeg,.png" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
                </div>

                <button type="button" class="w-full btn-eps flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium" id="btn-submit" onclick="alert('Submission system will be connected soon!')">
                    Submit Application
                </button>
            </form>
        </div>
    </main>

    <!-- 다국어 번역 스크립트 -->
    <script>
        const translations = {
            en: {
                navTitle: "EPS Global Portal", formTitle: "Submit Your Resume",
                downloadDesc: "Please download the standard resume form, fill it out, and upload it below.",
                btnDownload: "📥 Download Resume Form", labelEps: "EPS-TOPIK ID",
                labelName: "Full Name", labelPhone: "Phone Number", labelFile: "Upload Completed Resume",
                btnSubmit: "Submit Application"
            },
            my: {
                navTitle: "EPS အလုပ်သမားပေါ်တယ်", formTitle: "သင့်ကိုယ်ရေးရာဇဝင်ကို တင်သွင်းပါ",
                downloadDesc: "ကျေးဇူးပြု၍ ကိုယ်ရေးရာဇဝင် ပုံစံကို ဒေါင်းလုဒ်လုပ်ပါ၊ ဖြည့်စွက်ပြီး အောက်တွင် အပ်လုဒ်လုပ်ပါ။",
                btnDownload: "📥 ကိုယ်ရေးရာဇဝင် ပုံစံကို ဒေါင်းလုဒ်လုပ်ပါ", labelEps: "EPS-TOPIK ID",
                labelName: "အမည်အပြည့်အစုံ", labelPhone: "ဖုန်းနံပါတ်", labelFile: "ပြီးပြည့်စုံသော ကိုယ်ရေးရာဇဝင်ကို အပ်လုဒ်လုပ်ပါ",
                btnSubmit: "လျှောက်လွှာတင်သွင်းပါ"
            },
            vi: {
                navTitle: "Cổng thông tin EPS", formTitle: "Nộp sơ yếu lý lịch của bạn",
                downloadDesc: "Vui lòng tải xuống mẫu sơ yếu lý lịch chuẩn, điền vào và tải lên dưới đây.",
                btnDownload: "📥 Tải xuống mẫu sơ yếu lý lịch", labelEps: "ID EPS-TOPIK",
                labelName: "Họ và tên", labelPhone: "Số điện thoại", labelFile: "Tải lên Sơ yếu lý lịch đã hoàn thành",
                btnSubmit: "Nộp đơn"
            },
            id: {
                navTitle: "Portal Global EPS", formTitle: "Kirimkan Resume Anda",
                downloadDesc: "Silakan unduh formulir resume standar, isi, dan unggah di bawah ini.",
                btnDownload: "📥 Unduh Formulir Resume", labelEps: "ID EPS-TOPIK",
                labelName: "Nama Lengkap", labelPhone: "Nomor Telepon", labelFile: "Unggah Resume yang Telah Diisi",
                btnSubmit: "Kirim Aplikasi"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang];
            document.getElementById('nav-title').innerText = t.navTitle;
            document.getElementById('form-title').innerText = t.formTitle;
            document.getElementById('download-desc').innerText = t.downloadDesc;
            document.getElementById('btn-download').innerText = t.btnDownload;
            document.getElementById('label-eps').innerText = t.labelEps;
            document.getElementById('label-name').innerText = t.labelName;
            document.getElementById('label-phone').innerText = t.labelPhone;
            document.getElementById('label-file').innerText = t.labelFile;
            document.getElementById('btn-submit').innerText = t.btnSubmit;
        }
    </script>
</body>
</html>
